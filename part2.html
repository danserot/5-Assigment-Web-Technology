<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 2 — DOM Manipulation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/part2.js" defer></script>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="part1.html">Part 1</a>
    <a href="part2.html" aria-current="page">Part 2</a>
    <a href="part3.html">Part 3</a>
    <a href="part4.html">Part 4</a>
  </nav>
  <main>
    <h1>Part 2: DOM Manipulation</h1>
    <p>Tasks 2–4 practice changing text, styles, and list items.</p>
    <section>
      <h2>Task 2: Change text</h2>
      <p id="changeable-text" aria-live="polite">This is the original paragraph.</p>
      <button id="change-text" type="button">Change Text</button>
    </section>
    <section>
      <h2>Task 3: Change styles</h2>
      <div id="style-box" class="demo-box">Change my background or font size.</div>
      <div class="buttons">
        <button id="change-background" type="button">Change Background</button>
        <button id="change-font" type="button">Change Font Size</button>
      </div>
    </section>
    <section>
      <h2>Task 4: Add and remove items</h2>
      <ul id="item-list">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
      <div class="buttons">
        <button id="add-item" type="button">Add Item</button>
        <button id="remove-item" type="button">Remove Item</button>
      </div>
    </section>
  </main>
</body>
</html>
